name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build all platforms
        run: |
          mkdir -p bin
          # native
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/virtualis-agent ./cmd/agent
          ls -lh bin/virtualis-agent
          # cross
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${p%/*}"; GOARCH="${p#*/}"; EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
            OUT="bin/virtualis-agent-${GOOS}-${GOARCH}${EXT}"
            echo "-> $GOOS/$GOARCH"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "-s -w" -o "$OUT" ./cmd/agent
            ls -lh "$OUT"
          done
          ls -lh bin/

      - name: Checksums
        run: |
          cd bin
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            bin/*
            bin/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
