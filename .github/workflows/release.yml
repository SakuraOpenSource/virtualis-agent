name: Release

# Two ways to trigger:
#   - Manual: fill in the release tag on the Actions page; the tag is
#     created on the current commit when it does not exist yet.
#   - Tag push: `git tag v1.0.0 && git push --tags`.
#
# Tag shape decides the release kind:
#   - v1.2.3            -> stable release
#   - v1.2.3-rc.1       -> pre-release (GitHub "Pre-release" flag set)
#
# Release notes scope:
#   - pre-release: every commit since the last release of ANY kind
#   - stable:      every commit since the last STABLE release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.0.0 (created on the current commit if missing)"
        required: false
        type: string
      prerelease:
        description: "Force a pre-release (tags with a suffix are always pre-releases)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build verified release payload
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name || steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          # The tag lands in artifact names and the release itself, so guard
          # against typos early.
          # case takes the first matching pattern and "*" eats suffixes like
          # "-rc.1", so the suffixed (pre-release) pattern must come first.
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag" >&2; exit 1; }
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*-*)
              prerelease=true ;;
            v[0-9]*.[0-9]*.[0-9]*)
              prerelease=false ;;
            *)
              echo "Tag must look like v1.2.3 (stable) or v1.2.3-rc.1 (pre-release), got: $tag"
              exit 1 ;;
          esac
          # The manual checkbox can force a stable tag out as a pre-release.
          if [ "$INPUT_PRERELEASE" = "true" ]; then
            prerelease=true
          fi

          {
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (prerelease: $prerelease)"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate release notes
        env:
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          TAG: ${{ steps.meta.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # gh api needs a token to read the release list (prerelease flags).
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            bash scripts/release_notes.sh "$TAG" any > release-notes.md
          else
            bash scripts/release_notes.sh "$TAG" stable > release-notes.md
          fi
          test -f release-notes.md

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.2
          cache: true

      - name: Build required binaries
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ steps.meta.outputs.tag }}
          AGENT_SHA: ${{ steps.agent.outputs.sha }}
        run: |
          mkdir -p bin/release
          go mod verify
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            suffix=""; [ "$os" != windows ] || suffix=.exe
            GOOS="$os" GOARCH="$arch" go build -mod=readonly -trimpath -ldflags "-s -w" -o "bin/release/virtualis-agent-$os-$arch$suffix" ./cmd/agent
            test -s "bin/release/virtualis-agent-$os-$arch$suffix"
          done

      - name: Record release inputs and checksums
        env:
          FRONTEND_REF: ${{ inputs.frontend_ref || 'main' }}
          FRONTEND_SHA: ${{ steps.frontend.outputs.sha }}
          AGENT_REF: ${{ inputs.agent_ref || 'main' }}
          AGENT_SHA: ${{ steps.agent.outputs.sha }}
        run: |
          python3 .github/scripts/release_manifest.py bin/release/manifest.json
          cd bin/release
          sha256sum * > checksums.txt
          cp checksums.txt SHA256SUMS

      - name: Upload immutable build payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-payload
          if-no-files-found: error
          path: |
            bin/release/*
            release-notes.md

  publish:
    name: Publish without running source or dependency code
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build payload
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-payload
          path: .release

      - name: Check complete payload
        run: |
          test -s .release/bin/release/manifest.json
          test -f .release/release-notes.md
          cd .release/bin/release
          sha256sum --strict -c checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.build.outputs.prerelease }}
          fail_on_unmatched_files: true
          body_path: .release/release-notes.md
          files: .release/bin/release/*
